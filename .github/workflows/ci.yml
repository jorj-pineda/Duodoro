name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel superseded runs on the same branch/PR
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  database:
    name: Database migrations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v3
        with:
          version: 2.116.0

      # Start only the PostgreSQL service: the migration chain needs Supabase's
      # roles/auth schema/publication, but not Studio or the HTTP services.
      - name: Start disposable PostgreSQL 17 database
        run: >-
          supabase start -x
          gotrue,realtime,storage-api,imgproxy,kong,mailpit,postgrest,postgres-meta,studio,edge-runtime,logflare,vector,supavisor

      - name: Rebuild from the committed migration chain
        run: supabase db reset --local --no-seed

      - name: Lint the rebuilt schema
        run: supabase db lint --local --level warning --fail-on error

      - name: Verify the schema contract
        run: supabase test db

      - name: Stop disposable database
        if: always()
        run: supabase stop --no-backup

  server:
    name: Server tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
        working-directory: server
      - run: npm audit --omit=dev --audit-level=high
        working-directory: server
      - run: npm run test:run
        working-directory: server

  client:
    name: Client tests & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
        working-directory: client
      - run: npm audit --omit=dev --audit-level=high
        working-directory: client

      - run: npx tsc --noEmit
        working-directory: client

      - run: npm run lint
        working-directory: client

      - run: npm run test:run
        working-directory: client

      # NEXT_PUBLIC_* are inlined at build time, and the prerender pass
      # constructs the Supabase client — so the build needs syntactically valid
      # values. These dummies never reach a deployed artifact: Vercel builds
      # production with the real values from its own project settings.
      - run: npm run build
        working-directory: client
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-dummy-anon-key
          NEXT_PUBLIC_SOCKET_URL: http://localhost:3001

  browser-smoke:
    name: Browser release smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            server/package-lock.json

      - run: npm ci
        working-directory: server
      - run: npm ci
        working-directory: client
      - run: npx playwright install --with-deps chromium
        working-directory: client

      - run: npm run build
        working-directory: client
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-dummy-anon-key
          NEXT_PUBLIC_SOCKET_URL: http://localhost:3001

      - run: npm run test:e2e
        working-directory: client
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-dummy-anon-key
          NEXT_PUBLIC_SOCKET_URL: http://localhost:3001

      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-smoke-failure
          path: |
            client/playwright-report
            client/test-results
          retention-days: 7
